<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png?v=2">
    <style>
        :root {
            --bg: #282828;
            --bg-panel: #1d2021;
            --fg: #ebdbb2;
            --red: #fb4934;
            --orange: #fe8019;
            --green: #b8bb26;
            --aqua: #8ec07c;
            --gray: #928374;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* FULLSCREEN PIPES CANVAS */
        #pipes-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.35;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            background-color: var(--bg-panel);
            border: 2px solid var(--gray);
            border-left: 6px solid var(--orange);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            opacity: 0;
            animation: uiFadeIn 0.6s ease-out forwards;
            animation-delay: 0.2s;
        }

        @keyframes uiFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ascii-header {
            color: var(--red);
            font-size: 0.8rem;
            line-height: 1.1;
            white-space: pre;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--orange);
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        p {
            color: var(--fg);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .code-box {
            background-color: var(--bg);
            border: 1px solid var(--gray);
            padding: 10px;
            font-size: 0.9rem;
            color: var(--aqua);
            margin-bottom: 25px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--gray);
            padding: 8px 16px;
            text-decoration: none;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--orange);
            color: var(--bg);
            border-color: var(--orange);
        }

        .btn-primary {
            border-color: var(--green);
            color: var(--green);
        }

        .btn-primary:hover {
            background: var(--green);
            color: var(--bg);
        }

        .timer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--gray);
        }
    </style>
</head>
<body>

    <canvas id="pipes-canvas"></canvas>

    <div class="container">
        <div class="ascii-header">
 _  _   ___  _  _ 
| || | / _ \| || |
| || |_| | | | || |_
|__   _| |_| |__   _|
   |_|  \___/   |_|  
        </div>

        <h1>404 - Signal Lost</h1>
        <p>The requested path does not exist on this server or has been relocated.</p>

        <div class="code-box">
            $ status: ERR_NOT_FOUND<br>
            $ target: <span id="current-path">/unknown</span>
        </div>

        <div class="nav-links">
            <a href="/" class="btn btn-primary">&lt; Return Home</a>
            <a href="/games/tetris.html" class="btn">Play Tetris</a>
        </div>

        <div class="timer">
            Auto-redirecting home in <span id="countdown">15</span>s...
        </div>
    </div>

    <script>
        // --- 404 LOGIC ---
        document.getElementById('current-path').textContent = window.location.pathname;

        let seconds = 15;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = '/';
            }
        }, 1000);

        // --- CANVAS PIPES ANIMATION ---
        const pCanvas = document.getElementById('pipes-canvas');
        const pCtx = pCanvas.getContext('2d');
        let width, height, columns, rows, pipes = [];
        const size = 12; 
        const colors = ['#8ec07c', '#fe8019', '#fb4934', '#fabd2f', '#d3869b'];

        let lastTime = 0;
        const targetFPS = 25;
        const frameInterval = 1000 / targetFPS;
        let frameCount = 0;

        function initPipes() {
            width = pCanvas.width = window.innerWidth;
            height = pCanvas.height = window.innerHeight;
            columns = Math.floor(width / size);
            rows = Math.floor(height / size);
            pipes = [];
            for (let i = 0; i < 8; i++) pipes.push(new Pipe());
            
            pCtx.clearRect(0, 0, width, height);
        }

        class Pipe {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.floor(Math.random() * columns);
                this.y = Math.floor(Math.random() * rows);
                this.dir = Math.floor(Math.random() * 4);
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 0;
                this.maxLife = 20 + Math.random() * 40;
            }
            draw() {
                pCtx.strokeStyle = this.color;
                pCtx.lineWidth = 2;
                pCtx.lineCap = 'round';
                
                const startX = this.x * size + size / 2;
                const startY = this.y * size + size / 2;

                if (Math.random() < 0.2) this.dir = (this.dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
                
                let nextX = this.x;
                let nextY = this.y;

                if (this.dir === 0) nextY--;
                else if (this.dir === 1) nextX++;
                else if (this.dir === 2) nextY++;
                else if (this.dir === 3) nextX--;

                if (nextX < 0 || nextX >= columns || nextY < 0 || nextY >= rows) {
                    if (nextX < 0) this.x = columns - 1;
                    if (nextX >= columns) this.x = 0;
                    if (nextY < 0) this.y = rows - 1;
                    if (nextY >= rows) this.y = 0;
                } else {
                    this.x = nextX;
                    this.y = nextY;
                    
                    const endX = this.x * size + size / 2;
                    const endY = this.y * size + size / 2;

                    pCtx.beginPath();
                    pCtx.moveTo(startX, startY);
                    pCtx.lineTo(endX, endY);
                    pCtx.stroke();
                }

                this.life++;
                if (this.life > this.maxLife) this.reset();
            }
        }

        function animatePipes(timestamp) {
            requestAnimationFrame(animatePipes);

            if (!lastTime) lastTime = timestamp;
            const elapsed = timestamp - lastTime;

            if (elapsed > frameInterval) {
                lastTime = timestamp - (elapsed % frameInterval);

                pCtx.globalCompositeOperation = 'destination-out';
                pCtx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                pCtx.fillRect(0, 0, width, height);

                frameCount++;
                if (frameCount % 20 === 0) {
                    const imgData = pCtx.getImageData(0, 0, width, height);
                    const data = imgData.data;
                    let modified = false;
                    for (let i = 3; i < data.length; i += 4) {
                        if (data[i] < 12) {
                            data[i] = 0;
                            modified = true;
                        }
                    }
                    if (modified) pCtx.putImageData(imgData, 0, 0);
                }

                pCtx.globalCompositeOperation = 'source-over';
                pipes.forEach(p => p.draw());
            }
        }

        window.addEventListener('resize', initPipes);
        window.addEventListener('pageshow', () => {
            lastTime = 0;
            initPipes();
        });

        initPipes();
        requestAnimationFrame(animatePipes);
    </script>
</body>
</html>
