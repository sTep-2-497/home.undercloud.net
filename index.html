<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Userver | Undercloud</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png?v=2">
    <style>
        :root {
            --bg0: #282828; 
            --bg1: #3c3836; 
            --fg: #ebdbb2;
            --neon-aqua: #8ec07c; 
            --neon-orange: #fe8019;
            --neon-yellow: #fabd2f; 
            --shadow: rgba(0, 0, 0, 0.5);
            --gray: #928374;
        }

        body {
            margin: 0; 
            padding: 0; 
            color: var(--fg);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden;
            background-color: var(--bg0);
            position: relative;
        }

        /* FULLSCREEN PIPES CANVAS */
        #pipes-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.35;
            pointer-events: none;
        }

        .layout-container {
            position: relative; 
            z-index: 10; 
            display: flex;
            flex-direction: column; 
            gap: 20px; 
            align-items: center;
            opacity: 0; 
            animation: uiFadeIn 0.6s ease-out forwards; 
            animation-delay: 0.2s;
        }

        .main-wrapper { 
            display: flex; 
            align-items: stretch; 
            gap: 20px; 
        }

        @keyframes uiFadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* GAMES BOX */
        .games-box { 
            background: var(--bg1); 
            border-radius: 10px; 
            border: 1px solid #504945; 
            min-width: 200px; 
            box-shadow: 0 5px 15px var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .games-content { 
            position: relative;
            z-index: 2;
            padding: 1.5rem; 
        }

        .box-title { 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            color: var(--neon-yellow); 
            margin-bottom: 10px; 
            font-weight: bold;
            padding-left: 30px; 
        }
        
        .separator { 
            height: 1px; 
            background: #504945; 
            width: 100%; 
            margin-bottom: 15px; 
        }

        .btn-game {
            display: flex; 
            align-items: center; 
            text-decoration: none; 
            color: var(--fg);
            background: rgba(40, 40, 40, 0.6); 
            padding: 8px 12px; 
            border-radius: 5px;
            font-size: 0.9rem; 
            transition: all 0.2s ease; 
            border: 1px solid transparent; 
            margin-bottom: 8px;
            backdrop-filter: blur(2px);
            position: relative;
            z-index: 3;
        }
        .btn-game:hover { 
            background: rgba(250, 189, 47, 0.1); 
            border-color: var(--neon-yellow); 
            transform: translateX(5px); 
        }

        .container {
            text-align: center; 
            background: var(--bg1); 
            padding: 2.5rem 3.5rem;
            border-radius: 15px; 
            border: 1px solid #504945; 
            min-width: 380px;
            box-shadow: 0 10px 30px var(--shadow);
        }

        h1 { 
            margin: 0 0 1.5rem 0; 
            font-size: 2.8rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-shadow: 2px 2px 0px var(--bg0); 
        }

        .nav-wrapper { 
            display: flex; 
            gap: 20px; 
            justify-content: center; 
        }
        
        .btn { 
            text-decoration: none; 
            padding: 14px 30px; 
            font-weight: bold; 
            font-size: 1.1rem;
            border-radius: 8px; 
            text-transform: uppercase; 
            border: 2px solid transparent; 
            transition: 0.3s; 
        }
        .btn-files { 
            color: var(--neon-aqua); 
            border-color: var(--neon-aqua); 
        }
        .btn-files:hover { 
            background: var(--neon-aqua); 
            color: var(--bg0); 
            box-shadow: 0 0 20px rgba(142, 192, 124, 0.4); 
        }
        
        .btn-stream { 
            color: var(--neon-orange); 
            border-color: var(--neon-orange); 
        }
        .btn-stream:hover { 
            background: var(--neon-orange); 
            color: var(--bg0); 
            box-shadow: 0 0 20px rgba(254, 128, 25, 0.4); 
        }
        
        .status-dot { 
            height: 10px; 
            width: 10px; 
            background-color: #b8bb26; 
            border-radius: 50%; 
            display: inline-block; 
            margin-right: 8px; 
            box-shadow: 0 0 8px #b8bb26; 
        }

        footer { 
            margin-top: 1.5rem; 
            font-size: 0.85rem; 
            color: #7c6f64; 
        }
    </style>
</head>
<body>

    <!-- CANVAS FOR FULLSCREEN PIPES EFFECT -->
    <canvas id="pipes-canvas"></canvas>

    <div class="layout-container">
        <div class="main-wrapper">
            <div class="games-box">
                <div class="games-content">
                    <div class="box-title">ARCHIVE / GAMES</div>
                    <div class="separator"></div>
                    <a href="games/snake.html" class="btn-game">🐍 Snake</a>
                    <a href="games/tetris.html" class="btn-game">🧱 Tetris</a>
                </div>
            </div>

            <div class="container">
                <h1>Userver</h1>
                <div class="nav-wrapper">
                    <a href="https://files.undercloud.net" class="btn btn-files">Files</a>
                    <a href="https://stream.undercloud.net" class="btn btn-stream">Stream</a>
                </div>
                <footer><span class="status-dot"></span> System Operational</footer>
            </div>
        </div>
    </div>

    <script>
        const pCanvas = document.getElementById('pipes-canvas');
        const pCtx = pCanvas.getContext('2d');
        let width, height, columns, rows, pipes = [];
        const size = 12; 
        const colors = ['#8ec07c', '#fe8019', '#fb4934', '#fabd2f', '#d3869b'];

        let lastTime = 0;
        const targetFPS = 25;
        const frameInterval = 1000 / targetFPS;
        let frameCount = 0;

        function initPipes() {
            width = pCanvas.width = window.innerWidth;
            height = pCanvas.height = window.innerHeight;
            columns = Math.floor(width / size);
            rows = Math.floor(height / size);
            pipes = [];
            for (let i = 0; i < 8; i++) pipes.push(new Pipe());
            
            pCtx.clearRect(0, 0, width, height);
        }

        class Pipe {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.floor(Math.random() * columns);
                this.y = Math.floor(Math.random() * rows);
                this.dir = Math.floor(Math.random() * 4);
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 0;
                this.maxLife = 20 + Math.random() * 40;
            }
            draw() {
                pCtx.strokeStyle = this.color;
                pCtx.lineWidth = 2;
                pCtx.lineCap = 'round';
                
                const startX = this.x * size + size / 2;
                const startY = this.y * size + size / 2;

                if (Math.random() < 0.2) this.dir = (this.dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
                
                let nextX = this.x;
                let nextY = this.y;

                if (this.dir === 0) nextY--;
                else if (this.dir === 1) nextX++;
                else if (this.dir === 2) nextY++;
                else if (this.dir === 3) nextX--;

                // Detect wrap condition before drawing line to avoid screen-crossing trails
                if (nextX < 0 || nextX >= columns || nextY < 0 || nextY >= rows) {
                    if (nextX < 0) this.x = columns - 1;
                    if (nextX >= columns) this.x = 0;
                    if (nextY < 0) this.y = rows - 1;
                    if (nextY >= rows) this.y = 0;
                } else {
                    this.x = nextX;
                    this.y = nextY;
                    
                    const endX = this.x * size + size / 2;
                    const endY = this.y * size + size / 2;

                    pCtx.beginPath();
                    pCtx.moveTo(startX, startY);
                    pCtx.lineTo(endX, endY);
                    pCtx.stroke();
                }

                this.life++;
                if (this.life > this.maxLife) this.reset();
            }
        }

        function animatePipes(timestamp) {
            requestAnimationFrame(animatePipes);

            if (!lastTime) lastTime = timestamp;
            const elapsed = timestamp - lastTime;

            if (elapsed > frameInterval) {
                lastTime = timestamp - (elapsed % frameInterval);

                // Standard fade out
                pCtx.globalCompositeOperation = 'destination-out';
                pCtx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                pCtx.fillRect(0, 0, width, height);

                // Periodically zero-out stuck sub-pixel artifacts (every 20 frames)
                frameCount++;
                if (frameCount % 20 === 0) {
                    const imgData = pCtx.getImageData(0, 0, width, height);
                    const data = imgData.data;
                    let modified = false;
                    for (let i = 3; i < data.length; i += 4) {
                        if (data[i] < 12) {
                            data[i] = 0;
                            modified = true;
                        }
                    }
                    if (modified) pCtx.putImageData(imgData, 0, 0);
                }

                // Reset composite mode to normal for drawing pipes
                pCtx.globalCompositeOperation = 'source-over';
                pipes.forEach(p => p.draw());
            }
        }

        window.addEventListener('resize', initPipes);
        window.addEventListener('pageshow', () => {
            lastTime = 0;
            initPipes();
        });

        initPipes();
        requestAnimationFrame(animatePipes);
    </script>
</body>
</html>
