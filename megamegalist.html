<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megalist | Undercloud</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png?v=2">
    <link rel="stylesheet" href="css/oldstyle.css">
    <style>
        /* Specific styling overrides/additions for the Megalist container */
        .megalist-container {
            text-align: left;
            background: var(--bg1);
            padding: 2.5rem;
            border-radius: 15px;
            border: 1px solid #504945;
            width: 450px;
            max-width: 90vw;
            box-shadow: 0 10px 30px var(--shadow);
        }

        .megalist-container h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        .link-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--neon-yellow);
            margin: 1.5rem 0 10px 0;
            font-weight: bold;
        }

        .link-item {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: var(--fg);
            background: rgba(40, 40, 40, 0.6);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: 1px solid #504945;
            margin-bottom: 10px;
            backdrop-filter: blur(2px);
        }

        .link-item:hover {
            background: rgba(250, 189, 47, 0.1);
            border-color: var(--neon-yellow);
            transform: translateX(5px);
        }

        .link-title {
            font-weight: bold;
            color: var(--neon-aqua);
            margin-bottom: 4px;
        }

        .link-desc {
            font-size: 0.8rem;
            color: #bdae93;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--fg);
        }
    </style>
</head>
<body>

    <!-- CANVAS FOR FULLSCREEN PIPES EFFECT -->
    <canvas id="pipes-canvas"></canvas>

    <div class="layout-container">
        <div class="megalist-container">
            <h1>Megalist</h1>
            
            <div class="link-category">Curated Resources</div>
            <div class="separator"></div>

            <a href="https://fmhy.net/" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="link-title">FMHY (FreeMediaHeckYa)</span>
                <span class="link-desc">The largest collection of free media, tools, and software guides.</span>
            </a>

            <a href="https://everythingmoe.com/" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="link-title">EverythingMoe</span>
                <span class="link-desc">Comprehensive index of streaming, anime, and media platforms.</span>
            </a>

            <a href="/" class="back-link">&larr; Back to Home</a>
        </div>
    </div>

    <script>
        const pCanvas = document.getElementById('pipes-canvas');
        const pCtx = pCanvas.getContext('2d');
        let width, height, columns, rows, pipes = [];
        const size = 12; 
        const colors = ['#8ec07c', '#fe8019', '#fb4934', '#fabd2f', '#d3869b'];

        let lastTime = 0;
        const targetFPS = 25;
        const frameInterval = 1000 / targetFPS;
        let frameCount = 0;

        function initPipes() {
            width = pCanvas.width = window.innerWidth;
            height = pCanvas.height = window.innerHeight;
            columns = Math.floor(width / size);
            rows = Math.floor(height / size);
            pipes = [];
            for (let i = 0; i < 8; i++) pipes.push(new Pipe());
            pCtx.clearRect(0, 0, width, height);
        }

        class Pipe {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.floor(Math.random() * columns);
                this.y = Math.floor(Math.random() * rows);
                this.dir = Math.floor(Math.random() * 4);
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 0;
                this.maxLife = 20 + Math.random() * 40;
            }
            draw() {
                pCtx.strokeStyle = this.color;
                pCtx.lineWidth = 2;
                pCtx.lineCap = 'round';
                
                const startX = this.x * size + size / 2;
                const startY = this.y * size + size / 2;

                if (Math.random() < 0.2) this.dir = (this.dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
                
                let nextX = this.x;
                let nextY = this.y;

                if (this.dir === 0) nextY--;
                else if (this.dir === 1) nextX++;
                else if (this.dir === 2) nextY++;
                else if (this.dir === 3) nextX--;

                if (nextX < 0 || nextX >= columns || nextY < 0 || nextY >= rows) {
                    if (nextX < 0) this.x = columns - 1;
                    if (nextX >= columns) this.x = 0;
                    if (nextY < 0) this.y = rows - 1;
                    if (nextY >= rows) this.y = 0;
                } else {
                    this.x = nextX;
                    this.y = nextY;
                    
                    const endX = this.x * size + size / 2;
                    const endY = this.y * size + size / 2;

                    pCtx.beginPath();
                    pCtx.moveTo(startX, startY);
                    pCtx.lineTo(endX, endY);
                    pCtx.stroke();
                }

                this.life++;
                if (this.life > this.maxLife) this.reset();
            }
        }

        function animatePipes(timestamp) {
            requestAnimationFrame(animatePipes);
            if (!lastTime) lastTime = timestamp;
            const elapsed = timestamp - lastTime;

            if (elapsed > frameInterval) {
                lastTime = timestamp - (elapsed % frameInterval);

                pCtx.globalCompositeOperation = 'destination-out';
                pCtx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                pCtx.fillRect(0, 0, width, height);

                frameCount++;
                if (frameCount % 20 === 0) {
                    const imgData = pCtx.getImageData(0, 0, width, height);
                    const data = imgData.data;
                    let modified = false;
                    for (let i = 3; i < data.length; i += 4) {
                        if (data[i] < 12) {
                            data[i] = 0;
                            modified = true;
                        }
                    }
                    if (modified) pCtx.putImageData(imgData, 0, 0);
                }

                pCtx.globalCompositeOperation = 'source-over';
                pipes.forEach(p => p.draw());
            }
        }

        window.addEventListener('resize', initPipes);
        window.addEventListener('pageshow', () => {
            lastTime = 0;
            initPipes();
        });

        initPipes();
        requestAnimationFrame(animatePipes);
    </script>
</body>
</html>
